  <!-- Pull request icon -->
  <g fill="none"
    stroke="#FFFFFF"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round">

    <!-- PR circles -->
    <circle cx="176" cy="170" r="30"/>
    <circle cx="176" cy="334" r="30"/>
    <circle cx="320" cy="334" r="30"/>

    <!-- Main vertical line -->
    <line x1="176" y1="200" x2="176" y2="304"/>

    <!-- Branch line ending at the arrow tip beside the upper circle -->
    <path d="M320 304V218c0-27-22-48-49-48H206"/>

    <!-- Arrow head aligned to the branch line and upper circle -->
    <path d="M232 144L206 170L232 196"/>
