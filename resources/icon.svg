<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pull request review comment logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A66E8"/>
      <stop offset="100%" stop-color="#0047D9"/>
    </linearGradient>
  </defs>

  <!-- Filled comment bubble background -->
  <path d="M74 78h364c34 0 62 28 62 62v218c0 34-28 62-62 62H244l-72 58v-58H74c-34 0-62-28-62-62V140c0-34 28-62 62-62z"
