name: Bump extension version

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: Release level for an intentional minor or major release
        required: true
        type: choice
        options:
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        !startsWith(github.event.pull_request.head.ref, 'chore/version-bump-')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERSION_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || 'patch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Create version bump pull request
        env:
          BRANCH_NAME: chore/version-bump-${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH_NAME"
          npm version "$VERSION_LEVEL" --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          git add package.json package-lock.json
          git commit -m "chore: bump extension version to $version"
          git push --set-upstream origin "$BRANCH_NAME"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH_NAME" \
            --title "chore: bump extension version to $version" \
            --body "Automated version bump after a merged pull request."
