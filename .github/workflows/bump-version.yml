name: Bump extension version

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: Release level for an intentional minor or major release
        required: true
        type: choice
        options:
          - minor
          - major

permissions:
  contents: write

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERSION_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || 'patch' }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.VERSION_BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Commit and push version bump
        run: |
          set -euo pipefail
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          while :; do
            git fetch origin main
            worktree="$(mktemp -d)"
            git worktree add --detach "$worktree" origin/main
            if ! (
              set -euo pipefail
              cd "$worktree"
              npm version "$VERSION_LEVEL" --no-git-tag-version
              git add package.json package-lock.json
              if git diff --cached --quiet; then
                echo "No changes to commit"
                exit 0
              fi
              git commit -m "chore: bump extension version"
            ); then
              git worktree remove --force "$worktree"
              exit 1
            fi
            if git -C "$worktree" push origin HEAD:main; then
              git worktree remove --force "$worktree"
              exit 0
            fi
            git worktree remove --force "$worktree"
            sleep 2
          done
